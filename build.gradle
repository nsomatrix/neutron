plugins {
    id 'base'
}

def isRelease = providers.gradleProperty('buildType').getOrElse('dev').equalsIgnoreCase('release')
def appJarTask = isRelease ? 'releaseJar' : 'jar'

tasks.register('run') {
    group = 'application'
    description = 'Builds and launches both full-fledged Swing and Core versions simultaneously.'
    dependsOn ":neutron:neutron-javase-swing:${appJarTask}", ":neutron:neutron-core:${appJarTask}"
    doLast {
        def swingProject = project(':neutron:neutron-javase-swing')
        def coreProject = project(':neutron:neutron-core')
        def swingTask = swingProject.tasks.named(appJarTask).get()
        def coreTask = coreProject.tasks.named(appJarTask).get()
        def swingJar = isRelease ? swingTask.outputJar.get().asFile : swingTask.archiveFile.get().asFile
        def coreJar = isRelease ? coreTask.outputJar.get().asFile : coreTask.archiveFile.get().asFile

        def swingCmd = ['java'] + swingProject.application.applicationDefaultJvmArgs + ['-jar', swingJar.absolutePath]
        println "Launching Full-Fledged Version: ${swingJar.name}"
        new ProcessBuilder(swingCmd).start()

        def coreCmd = ['java'] + coreProject.application.applicationDefaultJvmArgs + ['-jar', coreJar.absolutePath]
        println "Launching Core Version: ${coreJar.name}"
        new ProcessBuilder(coreCmd).start()
    }
}

tasks.register('release') {
    group = 'build'
    description = 'Builds all standalone release JARs (ProGuard + XZ packed).'
    dependsOn ':neutron:neutron-javase-swing:releaseJar', ':neutron:neutron-core:releaseJar'
}

tasks.register('verifyRelease') {
    group = 'verification'
    description = 'Builds and runs end-to-end verification on all packed standalone release JARs.'
    dependsOn ':neutron:neutron-javase-swing:verifyRelease', ':neutron:neutron-core:verifyRelease'
}
