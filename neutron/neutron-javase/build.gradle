apply plugin: 'java-library'

sourceCompatibility = 1.8
targetCompatibility = 1.8

dependencies {
    api project(':neutron:neutron-midp')
    api project(':neutron:api')
    api project(':neutron:neutron-cldc')
    implementation 'asm:asm:3.1' // Assuming version 3.1 based on common usage with older projects
    testImplementation 'junit:junit:3.8.2'
}