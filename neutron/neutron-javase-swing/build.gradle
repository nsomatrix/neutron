buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.6.1'
    }
}

apply plugin: 'java-library'
apply plugin: 'application'

import proguard.gradle.ProGuardTask

sourceCompatibility = 1.8
targetCompatibility = 1.8

dependencies {
    api project(':neutron:neutron-javase')
    implementation project(path: ':neutron:neutron-injected', configuration: 'inject')
    implementation 'com.formdev:flatlaf:3.5.1'
}

mainClassName = 'org.neutron.app.Main'

jar {
    dependsOn ':neutron:neutron-javase:jar', ':neutron:neutron-midp:jar', ':neutron:api:jar', ':neutron:neutron-cldc:jar'
    manifest {
        attributes 'Main-Class': 'org.neutron.app.Main'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task proguard(type: ProGuardTask, dependsOn: jar) {
    injars jar.archiveFile
    outjars "${buildDir}/libs/neutron-javase-swing-2.0.5-SNAPSHOT-shrunk.jar"

    if (System.getProperty('java.version').startsWith('1.')) {
        libraryjars "${System.getProperty('java.home')}/lib/rt.jar"
    } else {
        libraryjars "${System.getProperty('java.home')}/jmods/java.base.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
        libraryjars "${System.getProperty('java.home')}/jmods/java.desktop.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
        libraryjars "${System.getProperty('java.home')}/jmods/java.datatransfer.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
    }

    configuration 'proguard.pro'
}

// Make assemble depend on proguard so the shrunk version is built automatically
assemble.dependsOn proguard
