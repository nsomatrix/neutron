buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.tukaani:xz:1.9'
    }
}

apply plugin: 'java-library'
apply plugin: 'application'

sourceCompatibility = 1.8
targetCompatibility = 1.8

dependencies {
    api project(':neutron:neutron-javase')
    implementation project(path: ':neutron:neutron-injected', configuration: 'inject')
    implementation project(':neutron:neutron-extensions:neutron-jsr-135')
    implementation project(':neutron:neutron-extensions:neutron-jsr-184')
    implementation project(':neutron:neutron-extensions:neutron-nokiaui')
    implementation project(':neutron:neutron-extensions:neutron-jsr-75')
    implementation project(':neutron:neutron-extensions:neutron-jsr-120')
    implementation project(':neutron:neutron-extensions:neutron-jsr-82')
    implementation project(':neutron:neutron-extensions:neutron-siemensapi')
    implementation project(':neutron:neutron-extensions:neutron-micro3d')
    implementation project(':neutron:neutron-extensions:neutron-opengl')
    implementation project(':neutron:neutron-extensions:neutron-oem-apis')
    implementation project(':neutron:neutron-extensions:neutron-jsr-234')
    implementation project(':neutron:neutron-extensions:neutron-jsr-239')
    implementation project(':neutron:neutron-extensions:neutron-jsr-226')
    implementation project(':neutron:neutron-extensions:neutron-jsr-172')
    implementation project(':neutron:neutron-extensions:neutron-jsr-179')
    implementation project(':neutron:neutron-extensions:neutron-jsr-211')
    implementation project(':neutron:neutron-extensions:neutron-jsr-256')
    implementation project(':neutron:neutron-extensions:neutron-device-large')
    implementation project(':neutron:neutron-extensions:neutron-device-minimum')
    implementation project(':neutron:neutron-extensions:neutron-device-resizable')
    implementation 'com.formdev:flatlaf:3.5.1'
    implementation 'org.tukaani:xz:1.9'
    testImplementation 'junit:junit:4.12'
}

mainClassName = 'org.neutron.app.SwingLauncher'

applicationDefaultJvmArgs = [
    '-Dsun.java2d.renderer=sun.java2d.marlin.MarlinRenderingEngine'
]

task rawJar(type: Jar) {
    dependsOn ':neutron:neutron-javase:jar', ':neutron:neutron-midp:jar', ':neutron:api:jar', ':neutron:neutron-cldc:jar',
              ':neutron:neutron-extensions:neutron-jsr-135:jar',
              ':neutron:neutron-extensions:neutron-jsr-184:jar',
              ':neutron:neutron-extensions:neutron-nokiaui:jar',
              ':neutron:neutron-extensions:neutron-jsr-75:jar',
              ':neutron:neutron-extensions:neutron-jsr-120:jar',
              ':neutron:neutron-extensions:neutron-jsr-82:jar',
              ':neutron:neutron-extensions:neutron-siemensapi:jar',
              ':neutron:neutron-extensions:neutron-micro3d:jar',
              ':neutron:neutron-extensions:neutron-opengl:jar',
              ':neutron:neutron-extensions:neutron-oem-apis:jar',
              ':neutron:neutron-extensions:neutron-jsr-234:jar',
              ':neutron:neutron-extensions:neutron-jsr-239:jar',
              ':neutron:neutron-extensions:neutron-jsr-226:jar',
              ':neutron:neutron-extensions:neutron-jsr-172:jar',
              ':neutron:neutron-extensions:neutron-jsr-179:jar',
              ':neutron:neutron-extensions:neutron-jsr-211:jar',
              ':neutron:neutron-extensions:neutron-jsr-256:jar',
              ':neutron:neutron-extensions:neutron-device-large:jar',
              ':neutron:neutron-extensions:neutron-device-minimum:jar',
              ':neutron:neutron-extensions:neutron-device-resizable:jar',
              compileJava, processResources
    archiveBaseName = 'neutron-javase-swing-raw'
    destinationDirectory = file("${buildDir}/tmp/rawJar")
    entryCompression = ZipEntryCompression.STORED
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.findAll { !it.name.contains('xz') }.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/maven/**'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude '**/README*'
    exclude '**/COPYING*'
    exclude '**/*.launch'
    exclude 'payload.jar.xz'
    exclude 'META-INF/**/*.sha1'
    exclude 'META-INF/**/*.git'
    exclude 'META-INF/native-image/**'
    exclude 'META-INF/INDEX.LIST'
    exclude '**/libglfw_async.dylib'
    exclude 'org/lwjgl/system/linux/liburing/**'
    exclude 'org/lwjgl/opengl/ARB*'
    exclude 'org/lwjgl/opengl/EXT*'
    exclude 'org/lwjgl/opengl/NV*'
    exclude 'org/lwjgl/opengl/AMD*'
    exclude 'org/lwjgl/opengl/ATI*'
    exclude 'org/lwjgl/opengl/APPLE*'
    exclude 'org/lwjgl/opengl/KHR*'
    exclude 'org/lwjgl/opengl/OVR*'
    exclude 'org/lwjgl/opengl/OES*'
    exclude 'org/lwjgl/opengl/INTEL*'
    exclude 'org/lwjgl/opengl/GL33*'
    exclude 'org/lwjgl/opengl/GL4*'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task compressPayload {
    dependsOn rawJar
    inputs.file rawJar.archiveFile
    outputs.file "${buildDir}/payload/payload.jar.xz"

    doLast {
        def inFile = rawJar.archiveFile.get().asFile
        def outFile = file("${buildDir}/payload/payload.jar.xz")
        outFile.parentFile.mkdirs()

        inFile.withInputStream { is ->
            outFile.withOutputStream { os ->
                def lzmaOpts = new org.tukaani.xz.LZMA2Options(9)
                lzmaOpts.setDictSize(16 * 1024 * 1024)
                lzmaOpts.setNiceLen(273)
                lzmaOpts.setMatchFinder(org.tukaani.xz.LZMA2Options.MF_BT4)
                lzmaOpts.setMode(org.tukaani.xz.LZMA2Options.MODE_NORMAL)
                def xzOut = new org.tukaani.xz.XZOutputStream(os, lzmaOpts)
                byte[] buf = new byte[32768]
                int n
                while ((n = is.read(buf)) != -1) {
                    xzOut.write(buf, 0, n)
                }
                xzOut.finish()
            }
        }
    }
}

jar {
    dependsOn compressPayload
    archiveBaseName = 'neutron-javase-swing'
    manifest {
        attributes 'Main-Class': 'org.neutron.app.SwingLauncher'
    }
    from fileTree(dir: "${buildDir}/classes/java/main", include: 'org/neutron/app/SwingLauncher*.class')
    from {
        configurations.runtimeClasspath.findAll { it.name.contains('xz') }.collect { zipTree(it) }
    }
    from("${buildDir}/payload") {
        include 'payload.jar.xz'
    }
    include 'org/neutron/app/SwingLauncher*.class'
    include 'org/tukaani/xz/**'
    include 'payload.jar.xz'
    exclude 'org/tukaani/xz/*Encoder*'
    exclude 'org/tukaani/xz/*OutputStream*'
    exclude 'org/tukaani/xz/lz/BT4*'
    exclude 'org/tukaani/xz/lz/HC4*'
    exclude 'org/tukaani/xz/lz/Hash234*'
    exclude 'org/tukaani/xz/lz/LZEncoder*'
    exclude 'org/tukaani/xz/lz/Matches*'
    exclude 'org/tukaani/xz/lzma/Optimum*'
    exclude 'org/tukaani/xz/rangecoder/RangeEncoder*'
    exclude 'org/tukaani/xz/delta/DeltaEncoder*'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

run.dependsOn compressPayload
