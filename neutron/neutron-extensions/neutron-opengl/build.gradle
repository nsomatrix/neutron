plugins {
    id 'neutron.java-conventions'
}

dependencies {
    api project(':neutron:neutron-midp')
    api project(':neutron:neutron-javase')
    api project(':neutron:neutron-extensions:neutron-micro3d')
    api project(':neutron:neutron-extensions:neutron-jsr-184')

    api platform(libs.lwjgl.bom)
    api libs.lwjgl.core
    api libs.lwjgl.opengl
    api libs.lwjgl.glfw

    // Mainstream 64-bit desktop LWJGL natives (matches Nokia M3G platform targets)
    [
        'natives-linux',
        'natives-windows',
        'natives-macos',
        'natives-macos-arm64'
    ].each { classifier ->
        runtimeOnly "org.lwjgl:lwjgl::${classifier}"
        runtimeOnly "org.lwjgl:lwjgl-opengl::${classifier}"
        runtimeOnly "org.lwjgl:lwjgl-glfw::${classifier}"
    }

    testImplementation libs.junit
}
