name: Build Universal Cross-Platform Standalone JAR

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-universal-jar:
    name: Build, Verify & Test Universal Standalone JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install System Dependencies for Testing
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dev libegl1-mesa-dev

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Dev Test Suite
        run: xvfb-run --auto-servernum ./gradlew test

      - name: Build & Verify Standalone Release JARs (ProGuard + XZ)
        run: xvfb-run --auto-servernum ./gradlew assemble verifyRelease -PbuildType=release

      - name: Upload Standalone Release JARs
        uses: actions/upload-artifact@v4
        with:
          name: neutron-standalone-jars
          path: |
            neutron/neutron-javase-swing/build/libs/release/neutron-javase-swing-*.jar
            neutron/neutron-core/build/libs/release/neutron-core-*.jar

      - name: Upload ProGuard Mappings
        uses: actions/upload-artifact@v4
        with:
          name: neutron-proguard-mappings
          path: |
            neutron/neutron-javase-swing/build/outputs/mapping/
            neutron/neutron-core/build/outputs/mapping/
