name: Build Universal Cross-Platform Standalone JAR

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux-natives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev
      - name: Build libjavam3g.so
        run: |
          cd neutron/neutron-extensions/neutron-jsr-184/src/main/cpp
          chmod +x build.sh
          ./build.sh
      - name: Upload Linux Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x86_64
          path: neutron/neutron-extensions/neutron-jsr-184/src/main/resources/natives/linux-x86_64/libjavam3g.so

  build-universal-jar:
    needs: [ build-linux-natives ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dev libegl1-mesa-dev

      - name: Download Linux Native Artifact
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x86_64
          path: neutron/neutron-extensions/neutron-jsr-184/src/main/resources/natives/linux-x86_64

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build All and Package Standalone JAR
        run: ./gradlew assemble

      - name: Run Test Suite
        run: xvfb-run --auto-servernum ./gradlew test

      - name: Upload Standalone Fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: neutron-standalone-jar
          path: neutron/neutron-javase-swing/build/libs/neutron-javase-swing-*.jar

