name: Build Universal Cross-Platform Standalone JAR

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-universal-jar:
    name: Build Universal Standalone JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install System Dependencies for Testing
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dev libegl1-mesa-dev

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build All and Package Standalone JAR
        run: ./gradlew assemble

      - name: Run Test Suite
        run: xvfb-run --auto-servernum ./gradlew test

      - name: Upload Standalone Fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: neutron-standalone-jar
          path: neutron/neutron-javase-swing/build/libs/neutron-javase-swing-*.jar
