# Project Coordinates
group=org.neutron
version=1.5.0

# Build Mode:
#   dev     - Fast incremental compilation, full debug symbols (-g), standard JARs (default)
#   release - Compact debug symbols (-g:lines,source), ProGuard shrinking/obfuscation, XZ-packed standalone JARs
buildType=dev

# Gradle Performance & Caching
org.gradle.jvmargs=-Xmx2g -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
